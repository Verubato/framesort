name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the addon
        uses: actions/checkout@v6

      # The build scripts live in the shared addon-devops repository, which every addon also
      # carries as a submodule. Checking it out separately rather than with submodules: true
      # keeps the SSH url in .gitmodules working for local development - a runner has no key
      # for it. If addon-devops is private, add a PAT with read access as a repository secret
      # and pass it here as `token: ${{ secrets.DEVOPS_TOKEN }}`.
      - name: Check out the shared build scripts
        uses: actions/checkout@v6
        with:
          repository: Verubato/addon-devops
          path: build

      # --local installs into the runner's own rock tree, which is the tree `luarocks path`
      # reports; a sudo install can land somewhere that path never mentions.
      - name: Install Lua and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          luarocks install --local --lua-version 5.1 luafilesystem
          luarocks install --local --lua-version 5.1 luacheck
          # Only FrameSort's suite needs this, but installing it everywhere keeps one workflow.
          luarocks install --local --lua-version 5.1 luaunit

      - name: Lint
        shell: pwsh
        run: ./build/Lint.ps1

      # always() so a lint failure doesn't hide the test result, and vice versa. Addons with no
      # suite report "no suite found" and pass.
      - name: Test
        if: always()
        shell: pwsh
        run: ./build/Test.ps1

      # These three report rather than fail: a translation backlog, a deliberately pinned
      # submodule and a client patch that landed this morning are all normal states, not build
      # breakages.
      - name: Check the build submodule is current
        if: always()
        shell: pwsh
        run: ./build/CheckSubmodule.ps1

      - name: Locale report
        if: always()
        shell: pwsh
        run: |
          $report = python ./build/CheckLocales.py | Out-String
          Write-Host $report
          if ($env:GITHUB_STEP_SUMMARY) {
            "## Locales`n`n``````n$report``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      # Warns when the TOC's interface numbers have fallen behind a live client, which is what
      # makes the addon show up greyed out as out of date in the character-select addon list.
      - name: Client build report
        if: always()
        shell: pwsh
        run: |
          $report = python ./build/CheckTocVersions.py | Out-String
          Write-Host $report
          if ($env:GITHUB_STEP_SUMMARY) {
            "## Client builds`n`n``````n$report``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
